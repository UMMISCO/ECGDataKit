name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "lib/src/**"
      - ".github/workflows/docs.yml"
  # The Releases and Activity pages are built from GitHub releases and tags
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release runs on its tag, which may not deploy to github-pages: start
  # the same workflow on main instead, so the Releases and Activity pages
  # show the new release
  rebuild-on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the docs workflow on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref main --repo "${{ github.repository }}"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install -e "./lib[all]"

      - name: Build documentation
        env:
          # Lets conf.py fetch the Releases page from the GitHub API without
          # hitting the unauthenticated rate limit on shared runner IPs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Copy CNAME for custom domain
        run: cp docs/_static/CNAME docs/_build/html/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
