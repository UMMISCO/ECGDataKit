[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecgdatakit"
dynamic = ["version"]
description = "Multi-format ECG file parsing and signal processing library"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Ahmad Fall", email = "ahmad.fall@ird.fr"}]
maintainers = [{name = "Ahmad Fall", email = "ahmad.fall@ird.fr"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "defusedxml>=0.7.1",
    # 1.0.0 drops entity references and 1.0.1 raises on them with disable_entities
    "xmltodict>=1.0.2",
]
keywords = ["ecg", "electrocardiogram", "signal-processing", "medical", "waveform", "hl7", "dicom", "edf", "scp-ecg", "wfdb", "cardiology", "ecg-parser", "ecg-processing", "mfer", "muse", "physionet", "heart-rate", "hrv", "alivecor", "kardia"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://ecgdatakit.ummisco.fr"
Documentation = "https://ecgdatakit.ummisco.fr"
Repository = "https://github.com/UMMISCO/ECGDataKit"
Issues = "https://github.com/UMMISCO/ECGDataKit/issues"
Changelog = "https://ecgdatakit.ummisco.fr/releases.html"
Mirror = "https://git.ummisco.fr/open/ecgdatakit"
UMMISCO = "https://www.ummisco.fr"
IRD = "https://www.ird.fr"

[project.optional-dependencies]
dicom = ["pydicom>=2.4"]
processing = ["scipy>=1.10"]
# biosppy imports peakutils without declaring it
cleaning = ["biosppy", "peakutils", "neurokit2"]
denoising = ["torch>=2.0"]
# R-peak, spectrum and quality plots use scipy
plotting = ["matplotlib>=3.7", "scipy>=1.10"]
plotting-interactive = ["plotly>=5.15", "scipy>=1.10"]
all = [
    "pydicom>=2.4",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "biosppy",
    "peakutils",
    "neurokit2",
]
dev = ["pytest>=9.0", "pytest-cov>=7.0", "ruff>=0.15"]
docs = [
    "sphinx>=8.0",
    "furo>=2024.8",
    "myst-parser>=4.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-sitemap>=2.6",
    "sphinxext-opengraph>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecgdatakit" = ["py.typed"]
"ecgdatakit.processing.nn" = ["weights/*.pt"]

[tool.setuptools.dynamic]
version = {attr = "ecgdatakit.__version__"}

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]